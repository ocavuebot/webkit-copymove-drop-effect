<!doctype html>
<meta charset="UTF-8" />
<title>dragend dropEffect with effectAllowed = copyMove</title>
<style>
  div { padding: 20px; border: 1px solid; margin: 8px 0; }
  output { font-weight: bold; color: grey; }
  output[data-v='move'] { color: green; }
  output[data-v='copy'] { color: red; }
</style>

<div id="source" draggable="true">Drag me</div>
<div id="a">Target A: dragover only calls preventDefault()</div>
<div id="b">Target B: dragover sets dropEffect = 'move'</div>
<p>A dragend: <output id="a-result"></output></p>
<p>B dragend: <output id="b-result"></output></p>
<p><code id="ua"></code></p>

<script>
  document.getElementById('ua').textContent = navigator.userAgent
  let target = null

  document.getElementById('source').addEventListener('dragstart', (event) => {
    event.dataTransfer.setData('text/plain', 'data')
    event.dataTransfer.effectAllowed = 'copyMove'
  })
  for (const id of ['a', 'b']) {
    const el = document.getElementById(id)
    el.addEventListener('dragover', (event) => {
      event.preventDefault()
      if (id === 'b') event.dataTransfer.dropEffect = 'move'
    })
    el.addEventListener('drop', (event) => {
      event.preventDefault()
      target = id
    })
  }
  document.getElementById('source').addEventListener('dragend', (event) => {
    if (target) {
      const out = document.getElementById(target + '-result')
      out.textContent = out.dataset.v = event.dataTransfer.dropEffect
    }
    target = null
  })
</script>
