name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.browser }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }} --reporter=list 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          echo "### ${{ matrix.os }} / ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -h '^RESULT' out.txt | sort -u >> $GITHUB_STEP_SUMMARY || true
          npx playwright --version >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
